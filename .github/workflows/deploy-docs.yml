name: Generate and Deploy IDLdoc via Sphinx

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Sphinx and IDL extension
        run: |
          pip install sphinx sphinx-contrib-idldoc

      - name: Initialize Sphinx Config
        run: |
          mkdir -p docs
          echo "import os" > docs/conf.py
          echo "import sys" >> docs/conf.py
          echo "extensions = ['sphinx_contrib.idldoc']" >> docs/conf.py
          echo "project = 'RED Project Documentation'" >> docs/conf.py
          echo "master_doc = 'index'" >> docs/conf.py
          echo "html_theme = 'alabaster'" >> docs/conf.py
          
          # Create main index page
          echo "RED Project Documentation" > docs/index.rst
          echo "=========================" >> docs/index.rst
          echo ".. idldoc:: .." >> docs/index.rst

      - name: Build HTML Documentation
        run: |
          sphinx-build -b html docs/ out-docs/

      - name: Debug - List generated files
        run: |
          ls -R out-docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'out-docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
