name: Generate and Deploy IDLdoc

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IDLdoc
        uses: actions/checkout@v4
        with:
          repository: 'mgalloy/idldoc'
          path: 'idldoc'
          submodules: 'recursive'

      - name: Setup IDL (Using GNU Data Language as a free alternative)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdl

      - name: Run IDLdoc
        run: |
          gdl -e "red_generate_docs"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'out-docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
