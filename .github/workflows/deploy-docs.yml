name: Generate and Deploy IDLdoc

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download IDLdoc
        uses: actions/checkout@v4
        with:
          repository: 'mgalloy/idldoc'
          path: 'idldoc'
          submodules: 'false'

      - name: Setup IDL (Using GNU Data Language as a free alternative)
        run: |
          sudo apt-get update
          sudo apt-get install -y gnudatalanguage

      - name: Run IDLdoc
        # We add the current directory to GDL's path via environment variables
        # and feed the batch commands via standard input (stdin)
        env:
          GDL_PATH: "+.:+./idldoc/src/"
        run: |
          gdl << 'EOF'
          .compile red_generate_docs
          red_generate_docs
          EXIT
          EOF

      - name: Debug - List generated files
        # Det här steget visar exakt hur strukturen ser ut på servern
        run: |
          echo "--- Looking for out-docs folder ---"
          if [ -d "out-docs" ]; then
            ls -R out-docs/
          else
            echo "Error: Folder out-docs does not exist!"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vi laddar upp hela rotmappen 'out-docs/'
          path: 'out-docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
